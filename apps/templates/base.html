{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogi Vibes | {% block title %}{% endblock %}</title>
    <!-- Unpoly -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/unpoly@3.12.0/unpoly.min.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <!-- Project styles -->
    <link rel="stylesheet" href="{% static 'core/css/site.css' %}">
    {% block styles %}{% endblock %}
</head>

<body>
    {% block body %}
        <!-- Public website background -->
        <div class="hero-background hero-background-current"
             style="background-image: url('{{ carousel_slides.0.image.url }}')"
             aria-hidden="true">
        </div>
        <div class="hero-background hero-background-next" aria-hidden="true"></div>

        <!-- Public navigation -->
        {% include "components/navigation/navbar.html" %}

        <!-- Public page content -->
        <main id="main-content">
            {% block content %}{% endblock %}
        </main>
    {% endblock %}

    <!-- Project JavaScript -->
    <script src="{% static 'core/js/site.js' %}"></script>
    <!-- Unpoly JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/unpoly@3.12.0/unpoly.min.js"></script>
    <!-- Unpoly configuration -->
    <script>
        up.fragment.config.mainTargets = [
            "#main-content"
        ];
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
