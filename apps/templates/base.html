{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Jogi Vibes{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Adventure beyond the ordinary with Jogi Vibes.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'core/css/design-system.css' %}">
{% block styles %}{% endblock %}
<script src="https://unpkg.com/unpoly@3.10.2/unpoly.min.js"></script>
</head>
<body>
{% include "components/navigation/navbar.html" %}
<main id="main-content">{% block content %}{% endblock %}</main>
{% include "components/footer/footer.html" %}
<script src="{% static 'core/js/site.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
