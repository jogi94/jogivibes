{% extends "base.html" %}

{% block content %}
<h1>
    {% if object %}
        Edit trip
    {% else %}
        Create trip
    {% endif %}
</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Save trip</button>
</form>

<a href="{% url 'trips:list' %}">Cancel</a>
{% endblock %}
